name: Build Native Swift iOS IPA (Xcode 16)

on:
  push:
    branches: [ main, native-swift-ios ]
  workflow_dispatch:
    inputs:
      screenshots_only:
        description: "Only take simulator screenshots (no IPA, no TestFlight)"
        type: boolean
        default: false
      skip_testflight:
        description: "Build and sign the IPAs only; don't upload them to TestFlight"
        type: boolean
        default: false
      tobacco_ios:
        description: "Build the cigarette section into the iPhone shop app (App Store guideline 1.4.3: a build with it can't pass App Store review)"
        type: boolean
        default: false

jobs:
  build-native-swift-ios:
    name: Build Native Swift IPA (macos-15 + Xcode 26)
    if: ${{ !inputs.screenshots_only }}
    runs-on: macos-15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          for xcode in /Applications/Xcode_26*.app /Applications/Xcode_26.app /Applications/Xcode_16*.app /Applications/Xcode.app; do
            if [ -d "$xcode" ]; then
              echo "Selecting $xcode"
              sudo xcode-select -s "$xcode/Contents/Developer"
              break
            fi
          done
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Native Xcode Project
        run: |
          cd ios-swift
          xcodegen generate

      - name: Resolve Swift Package Dependencies
        run: |
          cd ios-swift
          xcodebuild -resolvePackageDependencies -project DASHit.xcodeproj

      - name: Patch Swift Interfaces & Re-sign Frameworks
        run: |
          python3 -c '
          import os
          derived = os.path.expanduser("~/Library/Developer/Xcode/DerivedData")
          if os.path.exists(derived):
              for root, dirs, files in os.walk(derived):
                  for f in files:
                      if f.endswith(".swiftinterface"):
                          p = os.path.join(root, f)
                          try:
                              with open(p, "r", encoding="utf-8") as fl:
                                  content = fl.read()
                              if "$NonescapableTypes" in content:
                                  count = content.count("#if compiler(>=5.3) && $NonescapableTypes")
                                  content = content.replace("#if compiler(>=5.3) && $NonescapableTypes", "#if true")
                                  with open(p, "w", encoding="utf-8") as fl:
                                      fl.write(content)
                                  print(f"Patched {count} APIs in {f}")
                          except Exception as e:
                              print("Error:", e)
          '
          for fw in $(find "$HOME/Library/Developer/Xcode/DerivedData" -name "*.xcframework" 2>/dev/null || true); do
            echo "Re-signing $fw"
            codesign --force --deep --sign - "$fw" || true
          done

      - name: Install Apple Certificate and Provisioning Profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERT_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_CERT_PASSWORD || 'dashit2026' }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
          # App Store profile for the admin app (com.dashit.admin).
          ADMIN_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_ADMIN_PROVISION_PROFILE_BASE64 }}
          # App Store profile for the Live Activity widget (com.dashit.app.widgets).
          WIDGET_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_WIDGET_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: "dashit_keychain_pass"
        run: |
          if [ -z "$BUILD_CERTIFICATE_BASE64" ]; then
            echo "No signing certificate secret found — skipping certificate installation."
            exit 0
          fi
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o $PP_PATH

          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH $(security list-keychain -d user | tr -d ' "')

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          UUID=$(grep -aA1 UUID "$PP_PATH" | grep -o "[-A-Za-z0-9]\{36\}" | head -n1 || echo "7070b2b6-e577-47ac-a565-caa38b4ca0ab")
          cp "$PP_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/$UUID.mobileprovision
          cp "$PP_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/DASHit_AppStore_Profile.mobileprovision

          if [ -n "$ADMIN_PROVISION_PROFILE_BASE64" ]; then
            echo -n "$ADMIN_PROVISION_PROFILE_BASE64" | base64 --decode -o $RUNNER_TEMP/admin_pp.mobileprovision
            echo "Admin profile installed."
          else
            echo "No IOS_ADMIN_PROVISION_PROFILE_BASE64 secret: the admin IPA will be left unsigned."
          fi

          if [ -n "$WIDGET_PROVISION_PROFILE_BASE64" ]; then
            echo -n "$WIDGET_PROVISION_PROFILE_BASE64" | base64 --decode -o $RUNNER_TEMP/widget_pp.mobileprovision
            echo "Live Activity widget profile installed."
          else
            echo "No IOS_WIDGET_PROVISION_PROFILE_BASE64 secret: the Live Activity widget will be left out."
          fi

      - name: Build Xcode Archives
        run: |
          cd ios-swift
          # The cigarette section is compiled in only when this run asks for it
          # (see ios-swift/DASHit/Core/Utils/Tobacco.swift). Pushes never do.
          SHOP_FLAGS=()
          if [ "${{ inputs.tobacco_ios }}" = "true" ]; then
            echo "Cigarette section: ON (this build can't pass App Store review)"
            SHOP_FLAGS+=('SWIFT_ACTIVE_COMPILATION_CONDITIONS=$(inherited) TOBACCO_SECTION')
          else
            echo "Cigarette section: off"
          fi
          echo "=== Building DASHit Customer App Archive ==="
          xcodebuild archive \
            -project DASHit.xcodeproj \
            -scheme DASHit \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/DASHit.xcarchive \
            -skipMacroValidation \
            -skipPackagePluginValidation \
            CURRENT_PROJECT_VERSION=$((GITHUB_RUN_NUMBER + 300)) \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            ENABLE_USER_SCRIPT_SANDBOXING=NO \
            "${SHOP_FLAGS[@]}"

          echo "=== Building DASHit Admin Console App Archive ==="
          xcodebuild archive \
            -project DASHit.xcodeproj \
            -scheme DASHitAdmin \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/DASHitAdmin.xcarchive \
            -skipMacroValidation \
            -skipPackagePluginValidation \
            CURRENT_PROJECT_VERSION=$((GITHUB_RUN_NUMBER + 300)) \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            ENABLE_USER_SCRIPT_SANDBOXING=NO

      - name: Package and Sign Native IPAs
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERT_BASE64 }}
        run: |
          cd ios-swift/build
          BUILD_VER=$((GITHUB_RUN_NUMBER + 300))

          sign_and_package() {
            local ARCHIVE_NAME=$1
            local APP_NAME=$2
            local OUTPUT_IPA=$3
            # Each app is signed with the profile for its own bundle ID.
            local PP_PATH=$4

            echo "=== Packaging and Signing $OUTPUT_IPA from $ARCHIVE_NAME ==="
            rm -rf Payload
            mkdir -p Payload
            cp -r "$ARCHIVE_NAME/Products/Applications/$APP_NAME.app" Payload/

            # The Live Activity (lock screen and Dynamic Island order tracker)
            # lives in the widget extension. It ships only when there is a
            # profile to sign it with; without one it has to be left out, or
            # App Store Connect rejects the upload.
            WIDGET_PP="$RUNNER_TEMP/widget_pp.mobileprovision"
            if [ "$APP_NAME" = "DASHit" ] && [ -n "$BUILD_CERTIFICATE_BASE64" ] && [ -f "$WIDGET_PP" ] && [ -d "Payload/$APP_NAME.app/PlugIns" ]; then
              security cms -D -i "$WIDGET_PP" > $RUNNER_TEMP/widget_profile.plist
              /usr/libexec/PlistBuddy -x -c "Print :Entitlements" $RUNNER_TEMP/widget_profile.plist > $RUNNER_TEMP/widget_entitlements.plist
              for appex in Payload/$APP_NAME.app/PlugIns/*.appex; do
                [ -d "$appex" ] || continue
                cp "$WIDGET_PP" "$appex/embedded.mobileprovision"
                /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${BUILD_VER}" "$appex/Info.plist" 2>/dev/null || true
                # An extension must carry its app's version, or the upload is refused.
                APP_SHORT_VER=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "Payload/$APP_NAME.app/Info.plist")
                /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${APP_SHORT_VER}" "$appex/Info.plist" 2>/dev/null || true
                codesign --force --sign "Apple Distribution" --entitlements $RUNNER_TEMP/widget_entitlements.plist --generate-entitlement-der "$appex"
                echo "Signed $appex"
              done
            else
              rm -rf "Payload/$APP_NAME.app/PlugIns"
            fi

            if [ -n "$BUILD_CERTIFICATE_BASE64" ] && [ -f "$PP_PATH" ]; then
              cp "$PP_PATH" "Payload/$APP_NAME.app/embedded.mobileprovision"
              /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${BUILD_VER}" "Payload/$APP_NAME.app/Info.plist" 2>/dev/null || true
              /usr/libexec/PlistBuddy -c "Set :UIRequiresFullScreen true" "Payload/$APP_NAME.app/Info.plist" 2>/dev/null || /usr/libexec/PlistBuddy -c "Add :UIRequiresFullScreen bool true" "Payload/$APP_NAME.app/Info.plist" || true

              security cms -D -i "$PP_PATH" > $RUNNER_TEMP/profile.plist
              /usr/libexec/PlistBuddy -x -c "Print :Entitlements" $RUNNER_TEMP/profile.plist > $RUNNER_TEMP/entitlements.plist

              for fw in $(find "Payload/$APP_NAME.app" -name "*.framework" 2>/dev/null || true); do
                codesign --force --sign "Apple Distribution" --preserve-metadata=identifier,flags,runtime "$fw" || true
              done
              codesign --force --sign "Apple Distribution" --entitlements $RUNNER_TEMP/entitlements.plist --generate-entitlement-der "Payload/$APP_NAME.app"
            fi

            zip -r -q "$OUTPUT_IPA" Payload
            ls -lh "$OUTPUT_IPA"
          }

          sign_and_package "DASHit.xcarchive" "DASHit" "DASHit-Native.ipa" "$RUNNER_TEMP/build_pp.mobileprovision"
          sign_and_package "DASHitAdmin.xcarchive" "DASHitAdmin" "DASHit-Admin.ipa" "$RUNNER_TEMP/admin_pp.mobileprovision"

      - name: Upload Native iOS IPA Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DASHit-Native-Swift-IPA
          path: ios-swift/build/DASHit-Native.ipa
          if-no-files-found: error

      - name: Upload Native Admin IPA Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DASHit-Admin-Swift-IPA
          path: ios-swift/build/DASHit-Admin.ipa
          if-no-files-found: error

      - name: Upload Native Swift to TestFlight (Internal Testing)
        if: inputs.skip_testflight != true && ((env.APPLE_ID != '' && env.APPLE_APP_SPECIFIC_PASSWORD != '') || (env.APP_STORE_CONNECT_KEY_P8 != '' && env.APP_STORE_CONNECT_ISSUER_ID != ''))
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APP_STORE_CONNECT_KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID || '2P8Y532J2R' }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          echo "Uploading Native Swift IPA to Apple TestFlight..."
          UPLOAD_SUCCESS=0

          if [ -n "$APPLE_ID" ] && [ -n "$APPLE_APP_SPECIFIC_PASSWORD" ]; then
            echo "Uploading via Apple ID + App-Specific Password..."
            xcrun altool --upload-app \
              --type ios \
              --file ios-swift/build/DASHit-Native.ipa \
              --username "$APPLE_ID" \
              --password "$APPLE_APP_SPECIFIC_PASSWORD" \
              --verbose && UPLOAD_SUCCESS=1 || echo "Apple ID upload attempt failed."
          fi

          if [ $UPLOAD_SUCCESS -eq 0 ] && [ -n "$APP_STORE_CONNECT_KEY_P8" ] && [ -n "$APP_STORE_CONNECT_ISSUER_ID" ]; then
            echo "Uploading via App Store Connect API Key..."
            CLEAN_KEY_ID=$(echo "$APP_STORE_CONNECT_KEY_ID" | tr -d '[:space:]')
            CLEAN_ISSUER_ID=$(echo "$APP_STORE_CONNECT_ISSUER_ID" | tr -d '[:space:]')

            mkdir -p ~/.appstoreconnect/private_keys ~/.private_keys
            printf "%s\n" "$APP_STORE_CONNECT_KEY_P8" > ~/.appstoreconnect/private_keys/AuthKey_${CLEAN_KEY_ID}.p8
            printf "%s\n" "$APP_STORE_CONNECT_KEY_P8" > ~/.private_keys/AuthKey_${CLEAN_KEY_ID}.p8
            chmod 600 ~/.appstoreconnect/private_keys/AuthKey_${CLEAN_KEY_ID}.p8

            xcrun altool --upload-app \
              --type ios \
              --file ios-swift/build/DASHit-Native.ipa \
              --apiKey "$CLEAN_KEY_ID" \
              --apiIssuer "$CLEAN_ISSUER_ID" \
              --verbose && UPLOAD_SUCCESS=1 || echo "API Key upload attempt failed."
          fi

          if [ $UPLOAD_SUCCESS -eq 0 ]; then
            echo "WARNING: TestFlight upload did not complete. The signed IPA artifact is saved above."
          else
            echo "SUCCESS: Native Swift IPA uploaded to Apple TestFlight!"
          fi

      - name: Upload Admin App to TestFlight
        # Needs the admin profile, and an app for com.dashit.admin in App Store Connect.
        if: inputs.skip_testflight != true && env.ADMIN_PROVISION_PROFILE_BASE64 != '' && env.APP_STORE_CONNECT_KEY_P8 != '' && env.APP_STORE_CONNECT_ISSUER_ID != ''
        env:
          ADMIN_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_ADMIN_PROVISION_PROFILE_BASE64 }}
          APP_STORE_CONNECT_KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID || '2P8Y532J2R' }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          CLEAN_KEY_ID=$(echo "$APP_STORE_CONNECT_KEY_ID" | tr -d '[:space:]')
          CLEAN_ISSUER_ID=$(echo "$APP_STORE_CONNECT_ISSUER_ID" | tr -d '[:space:]')
          mkdir -p ~/.appstoreconnect/private_keys ~/.private_keys
          printf "%s\n" "$APP_STORE_CONNECT_KEY_P8" > ~/.appstoreconnect/private_keys/AuthKey_${CLEAN_KEY_ID}.p8
          printf "%s\n" "$APP_STORE_CONNECT_KEY_P8" > ~/.private_keys/AuthKey_${CLEAN_KEY_ID}.p8
          chmod 600 ~/.appstoreconnect/private_keys/AuthKey_${CLEAN_KEY_ID}.p8

          if xcrun altool --upload-app \
              --type ios \
              --file ios-swift/build/DASHit-Admin.ipa \
              --apiKey "$CLEAN_KEY_ID" \
              --apiIssuer "$CLEAN_ISSUER_ID" \
              --verbose; then
            echo "SUCCESS: Admin IPA uploaded to Apple TestFlight!"
          else
            echo "WARNING: admin upload failed. Is there an app for com.dashit.admin in App Store Connect?"
          fi

  # Run with screenshots_only = true: Debug builds of both apps in the iPad and
  # iPhone simulators, opened in known states through the DEBUG-only launch
  # arguments in ios-swift/DASHit/Core/Utils/ScreenshotHooks.swift, so UI work
  # can be checked without a Mac. The admin runs on a sample shop
  # (-DASHitAdminDemo), so it needs no sign-in or live data. Nothing is signed
  # or uploaded to TestFlight.
  screenshots:
    name: Capture simulator screenshots
    if: ${{ inputs.screenshots_only }}
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          for xcode in /Applications/Xcode_26*.app /Applications/Xcode_26.app /Applications/Xcode_16*.app /Applications/Xcode.app; do
            if [ -d "$xcode" ]; then
              echo "Selecting $xcode"
              sudo xcode-select -s "$xcode/Contents/Developer"
              break
            fi
          done
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: |
          cd ios-swift
          xcodegen generate

      - name: Resolve Swift Package Dependencies
        run: |
          cd ios-swift
          xcodebuild -resolvePackageDependencies -project DASHit.xcodeproj

      # Same interface patch the IPA workflow applies to the resolved packages.
      - name: Patch Swift Interfaces
        run: |
          python3 -c '
          import os
          derived = os.path.expanduser("~/Library/Developer/Xcode/DerivedData")
          for root, dirs, files in os.walk(derived):
              for f in files:
                  if f.endswith(".swiftinterface"):
                      p = os.path.join(root, f)
                      try:
                          with open(p, "r", encoding="utf-8") as fl:
                              content = fl.read()
                          if "$NonescapableTypes" in content:
                              content = content.replace("#if compiler(>=5.3) && $NonescapableTypes", "#if true")
                              with open(p, "w", encoding="utf-8") as fl:
                                  fl.write(content)
                      except Exception:
                          pass
          '

      - name: Pick and boot an iPad and an iPhone
        run: |
          pick() {
            xcrun simctl list devices available -j | python3 -c '
          import json, sys
          prefs = sys.argv[1].split("|")
          family = sys.argv[2]
          devices = json.load(sys.stdin)["devices"]
          runtimes = sorted((rt for rt in devices if "iOS" in rt), reverse=True)
          for name in prefs:
              for rt in runtimes:
                  for d in devices[rt]:
                      if d["name"] == name:
                          print(d["udid"]); sys.exit(0)
          for rt in runtimes:
              for d in devices[rt]:
                  if d["name"].startswith(family):
                      print(d["udid"]); sys.exit(0)
          ' "$1" "$2"
          }
          IPAD=$(pick "iPad Pro 13-inch (M4)|iPad Pro 13-inch (M5)|iPad Air 13-inch (M3)|iPad Air 13-inch (M2)|iPad Pro (12.9-inch) (6th generation)" "iPad")
          IPHONE=$(pick "iPhone 16 Pro|iPhone 17 Pro|iPhone 15 Pro|iPhone 16" "iPhone")
          echo "iPad: $IPAD  iPhone: $IPHONE"
          echo "IPAD_UDID=$IPAD" >> "$GITHUB_ENV"
          echo "IPHONE_UDID=$IPHONE" >> "$GITHUB_ENV"
          for udid in "$IPAD" "$IPHONE"; do
            xcrun simctl boot "$udid" || true
            xcrun simctl bootstatus "$udid" -b
            xcrun simctl status_bar "$udid" override --time "9:41" --batteryState charged --batteryLevel 100 --wifiBars 3 --cellularBars 4 || true
          done

      - name: Build admin app for iPad simulator
        run: |
          cd ios-swift
          xcodebuild build \
            -project DASHit.xcodeproj \
            -scheme DASHitAdmin \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$IPAD_UDID" \
            -skipMacroValidation \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            ENABLE_USER_SCRIPT_SANDBOXING=NO \
            > "$RUNNER_TEMP/build-admin.log" 2>&1 \
            || { grep -E "error:" "$RUNNER_TEMP/build-admin.log" | head -n 80; tail -n 30 "$RUNNER_TEMP/build-admin.log"; exit 1; }
          grep -E "BUILD SUCCEEDED" "$RUNNER_TEMP/build-admin.log" || true
          APP=$(find "$HOME/Library/Developer/Xcode/DerivedData" -path "*Debug-iphonesimulator/DASHitAdmin.app" -type d | head -n 1)
          echo "Built $APP"
          test -n "$APP"
          echo "ADMIN_APP=$APP" >> "$GITHUB_ENV"

      - name: Build shop app for iPhone simulator
        run: |
          cd ios-swift
          xcodebuild build \
            -project DASHit.xcodeproj \
            -scheme DASHit \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$IPHONE_UDID" \
            -skipMacroValidation \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            ENABLE_USER_SCRIPT_SANDBOXING=NO \
            > "$RUNNER_TEMP/build-shop.log" 2>&1 \
            || { grep -E "error:" "$RUNNER_TEMP/build-shop.log" | head -n 80; tail -n 30 "$RUNNER_TEMP/build-shop.log"; exit 1; }
          grep -E "BUILD SUCCEEDED" "$RUNNER_TEMP/build-shop.log" || true
          APP=$(find "$HOME/Library/Developer/Xcode/DerivedData" -path "*Debug-iphonesimulator/DASHit.app" -type d | head -n 1)
          echo "Built $APP"
          test -n "$APP"
          echo "SHOP_APP=$APP" >> "$GITHUB_ENV"

      - name: Capture admin screenshots (iPad)
        run: |
          mkdir -p screenshots
          BUNDLE=com.dashit.admin
          xcrun simctl install "$IPAD_UDID" "$ADMIN_APP"

          shoot() {
            name="$1"; shift
            xcrun simctl terminate "$IPAD_UDID" "$BUNDLE" 2>/dev/null || true
            xcrun simctl launch "$IPAD_UDID" "$BUNDLE" -DASHitAdminDemo YES "$@"
            sleep 10
            xcrun simctl io "$IPAD_UDID" screenshot "screenshots/$name.png"
            echo "captured $name"
          }

          xcrun simctl ui "$IPAD_UDID" appearance light
          shoot ipad-portrait-01-home
          shoot ipad-portrait-02-orders -DASHitAdminTab Orders

          # Landscape: turn the device from the Simulator app's menu (best effort).
          open -a Simulator --args -CurrentDeviceUDID "$IPAD_UDID" || true
          sleep 8
          osascript -e 'tell application "Simulator" to activate' \
                    -e 'tell application "System Events" to tell process "Simulator" to click menu item "Rotate Left" of menu "Device" of menu bar 1' \
            && echo "rotated" || echo "could not rotate; staying in portrait"
          sleep 4

          shoot ipad-01-home-light
          shoot ipad-02-orders-light -DASHitAdminTab Orders
          shoot ipad-03-order-details-light -DASHitAdminTab Orders -DASHitAdminOpenOrder YES
          shoot ipad-04-stock-light -DASHitAdminTab Stock
          shoot ipad-05-add-item-light -DASHitAdminTab "Add an item"
          shoot ipad-06-shop-settings-light -DASHitAdminTab "Shop settings"
          shoot ipad-07-import-csv-light -DASHitAdminTab "Import CSV"
          shoot ipad-08-distributors-light -DASHitAdminTab Distributors

          xcrun simctl ui "$IPAD_UDID" appearance dark
          shoot ipad-09-home-dark
          shoot ipad-10-orders-dark -DASHitAdminTab Orders
          xcrun simctl ui "$IPAD_UDID" appearance light

      - name: Capture shop screenshots (iPhone)
        run: |
          BUNDLE=com.dashit.app
          xcrun simctl install "$IPHONE_UDID" "$SHOP_APP"

          shoot() {
            name="$1"; shift
            xcrun simctl terminate "$IPHONE_UDID" "$BUNDLE" 2>/dev/null || true
            xcrun simctl launch "$IPHONE_UDID" "$BUNDLE" "$@"
            sleep 12
            xcrun simctl io "$IPHONE_UDID" screenshot "screenshots/$name.png"
            echo "captured $name"
          }

          shoot iphone-01-home-light -DASHitDemoCart YES -dashit_theme light
          shoot iphone-02-cart-remove-all -DASHitDemoCart YES -DASHitOpenCart YES -dashit_theme light
          shoot iphone-03-order-received -DASHitDemoCart YES -DASHitDemoOrder YES -DASHitDemoOrderPlaced YES -DASHitOpenTracking YES -dashit_theme light
          shoot iphone-04-order-packing -DASHitDemoCart YES -DASHitDemoOrder YES -DASHitDemoOrderPacking YES -DASHitOpenTracking YES -dashit_theme light
          shoot iphone-05-order-on-the-way -DASHitDemoCart YES -DASHitDemoOrder YES -DASHitOpenTracking YES -dashit_theme dark
          shoot iphone-06-sign-up -DASHitOpenSignUp YES -dashit_theme dark
          shoot iphone-07-order-received-dark -DASHitDemoCart YES -DASHitDemoOrder YES -DASHitDemoOrderPlaced YES -DASHitOpenTracking YES -dashit_theme dark
          ls -la screenshots

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-ios-screenshots
          path: screenshots/*.png
          if-no-files-found: warn
