name: Build Native Swift iOS IPA (Xcode 16)

on:
  push:
    branches: [ main, native-swift-ios ]
  workflow_dispatch:

jobs:
  build-native-swift-ios:
    name: Build Native Swift IPA (macos-14 + Xcode 16)
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode 16
        run: |
          for xcode in /Applications/Xcode_16*.app /Applications/Xcode_16.app; do
            if [ -d "$xcode" ]; then
              echo "Selecting $xcode"
              sudo xcode-select -s "$xcode/Contents/Developer"
              break
            fi
          done
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Native Xcode Project
        run: |
          cd ios-swift
          xcodegen generate

      - name: Resolve Swift Package Dependencies
        run: |
          cd ios-swift
          xcodebuild -resolvePackageDependencies -project DASHit.xcodeproj

      - name: Patch Swift Interfaces & Re-sign Frameworks
        run: |
          python3 -c '
          import os
          derived = os.path.expanduser("~/Library/Developer/Xcode/DerivedData")
          if os.path.exists(derived):
              for root, dirs, files in os.walk(derived):
                  for f in files:
                      if f.endswith(".swiftinterface"):
                          p = os.path.join(root, f)
                          try:
                              with open(p, "r", encoding="utf-8") as fl:
                                  content = fl.read()
                              if "$NonescapableTypes" in content:
                                  count = content.count("#if compiler(>=5.3) && $NonescapableTypes")
                                  content = content.replace("#if compiler(>=5.3) && $NonescapableTypes", "#if true")
                                  with open(p, "w", encoding="utf-8") as fl:
                                      fl.write(content)
                                  print(f"Patched {count} APIs in {f}")
                          except Exception as e:
                              print("Error:", e)
          '
          for fw in $(find "$HOME/Library/Developer/Xcode/DerivedData" -name "*.xcframework" 2>/dev/null || true); do
            echo "Re-signing $fw"
            codesign --force --deep --sign - "$fw" || true
          done

      - name: Install Apple Certificate and Provisioning Profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERT_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_CERT_PASSWORD || 'dashit2026' }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: "dashit_keychain_pass"
        run: |
          if [ -z "$BUILD_CERTIFICATE_BASE64" ]; then
            echo "No signing certificate secret found — skipping certificate installation."
            exit 0
          fi
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o $PP_PATH

          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH $(security list-keychain -d user | tr -d ' "')

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          UUID=$(grep -aA1 UUID "$PP_PATH" | grep -o "[-A-Za-z0-9]\{36\}" | head -n1 || echo "7070b2b6-e577-47ac-a565-caa38b4ca0ab")
          cp "$PP_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/$UUID.mobileprovision
          cp "$PP_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/DASHit_AppStore_Profile.mobileprovision

      - name: Build Xcode Archive
        run: |
          cd ios-swift
          xcodebuild archive \
            -project DASHit.xcodeproj \
            -scheme DASHit \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/DASHit.xcarchive \
            -skipMacroValidation \
            -skipPackagePluginValidation \
            CURRENT_PROJECT_VERSION=$GITHUB_RUN_NUMBER \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            ENABLE_USER_SCRIPT_SANDBOXING=NO

      - name: Package and Sign Native IPA
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERT_BASE64 }}
        run: |
          cd ios-swift/build
          mkdir -p Payload
          cp -r DASHit.xcarchive/Products/Applications/DASHit.app Payload/

          # Clean up any unprovisioned app extensions since provisioning profile is com.dashit.app only
          rm -rf Payload/DASHit.app/PlugIns

          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          if [ -n "$BUILD_CERTIFICATE_BASE64" ] && [ -f "$PP_PATH" ]; then
            echo "Signing Native Swift App with Apple Distribution Certificate..."
            cp "$PP_PATH" Payload/DASHit.app/embedded.mobileprovision

            /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${GITHUB_RUN_NUMBER}" Payload/DASHit.app/Info.plist 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Set :DTPlatformVersion 26.0" Payload/DASHit.app/Info.plist 2>/dev/null || /usr/libexec/PlistBuddy -c "Add :DTPlatformVersion string 26.0" Payload/DASHit.app/Info.plist || true
            /usr/libexec/PlistBuddy -c "Set :DTSDKName iphoneos26.0" Payload/DASHit.app/Info.plist 2>/dev/null || /usr/libexec/PlistBuddy -c "Add :DTSDKName string iphoneos26.0" Payload/DASHit.app/Info.plist || true
            /usr/libexec/PlistBuddy -c "Set :DTXcode 2600" Payload/DASHit.app/Info.plist 2>/dev/null || /usr/libexec/PlistBuddy -c "Add :DTXcode string 2600" Payload/DASHit.app/Info.plist || true
            /usr/libexec/PlistBuddy -c "Set :DTXcodeBuild 26A100" Payload/DASHit.app/Info.plist 2>/dev/null || /usr/libexec/PlistBuddy -c "Add :DTXcodeBuild string 26A100" Payload/DASHit.app/Info.plist || true
            /usr/libexec/PlistBuddy -c "Set :DTSDKBuild 26A100" Payload/DASHit.app/Info.plist 2>/dev/null || /usr/libexec/PlistBuddy -c "Add :DTSDKBuild string 26A100" Payload/DASHit.app/Info.plist || true
            /usr/libexec/PlistBuddy -c "Set :DTPlatformBuild 26A100" Payload/DASHit.app/Info.plist 2>/dev/null || /usr/libexec/PlistBuddy -c "Add :DTPlatformBuild string 26A100" Payload/DASHit.app/Info.plist || true

            for fw in $(find Payload/DASHit.app -name "*.framework" 2>/dev/null || true); do
              codesign --force --sign "Apple Distribution" --preserve-metadata=identifier,flags,runtime "$fw" || true
            done
            codesign --force --sign "Apple Distribution" --entitlements ../DASHit/DASHit.entitlements --generate-entitlement-der Payload/DASHit.app
          fi

          zip -r -q DASHit-Native.ipa Payload
          ls -lh DASHit-Native.ipa

      - name: Upload Native iOS IPA Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DASHit-Native-Swift-IPA
          path: ios-swift/build/DASHit-Native.ipa
          if-no-files-found: error

      - name: Upload Native Swift to TestFlight (Internal Testing)
        if: (env.APPLE_ID != '' && env.APPLE_APP_SPECIFIC_PASSWORD != '') || (env.APP_STORE_CONNECT_KEY_P8 != '' && env.APP_STORE_CONNECT_ISSUER_ID != '')
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APP_STORE_CONNECT_KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID || '2P8Y532J2R' }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          echo "Uploading Native Swift IPA to Apple TestFlight..."
          UPLOAD_SUCCESS=0

          if [ -n "$APPLE_ID" ] && [ -n "$APPLE_APP_SPECIFIC_PASSWORD" ]; then
            echo "Uploading via Apple ID + App-Specific Password..."
            xcrun altool --upload-app \
              --type ios \
              --file ios-swift/build/DASHit-Native.ipa \
              --username "$APPLE_ID" \
              --password "$APPLE_APP_SPECIFIC_PASSWORD" \
              --verbose && UPLOAD_SUCCESS=1 || echo "Apple ID upload attempt failed."
          fi

          if [ $UPLOAD_SUCCESS -eq 0 ] && [ -n "$APP_STORE_CONNECT_KEY_P8" ] && [ -n "$APP_STORE_CONNECT_ISSUER_ID" ]; then
            echo "Uploading via App Store Connect API Key..."
            CLEAN_KEY_ID=$(echo "$APP_STORE_CONNECT_KEY_ID" | tr -d '[:space:]')
            CLEAN_ISSUER_ID=$(echo "$APP_STORE_CONNECT_ISSUER_ID" | tr -d '[:space:]')

            mkdir -p ~/.appstoreconnect/private_keys ~/.private_keys
            printf "%s\n" "$APP_STORE_CONNECT_KEY_P8" > ~/.appstoreconnect/private_keys/AuthKey_${CLEAN_KEY_ID}.p8
            printf "%s\n" "$APP_STORE_CONNECT_KEY_P8" > ~/.private_keys/AuthKey_${CLEAN_KEY_ID}.p8
            chmod 600 ~/.appstoreconnect/private_keys/AuthKey_${CLEAN_KEY_ID}.p8

            xcrun altool --upload-app \
              --type ios \
              --file ios-swift/build/DASHit-Native.ipa \
              --apiKey "$CLEAN_KEY_ID" \
              --apiIssuer "$CLEAN_ISSUER_ID" \
              --verbose && UPLOAD_SUCCESS=1 || echo "API Key upload attempt failed."
          fi

          if [ $UPLOAD_SUCCESS -eq 0 ]; then
            echo "WARNING: TestFlight upload did not complete. The signed IPA artifact is saved above."
          else
            echo "SUCCESS: Native Swift IPA uploaded to Apple TestFlight!"
          fi
