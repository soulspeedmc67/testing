name: Build Native Swift iOS IPA (Xcode 16)

on:
  push:
    branches: [ native-swift-ios ]
  workflow_dispatch:

jobs:
  build-native-swift-ios:
    name: Build Native Swift IPA (macos-14 + Xcode 16)
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode 16
        run: |
          for xcode in /Applications/Xcode_16*.app /Applications/Xcode_16.app; do
            if [ -d "$xcode" ]; then
              echo "Selecting $xcode"
              sudo xcode-select -s "$xcode/Contents/Developer"
              break
            fi
          done
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Native Xcode Project
        run: |
          cd ios-swift
          xcodegen generate

      - name: Resolve Swift Package Dependencies
        run: |
          cd ios-swift
          xcodebuild -resolvePackageDependencies -project DASHit.xcodeproj

      - name: Patch Swift Interfaces & Re-sign Frameworks
        run: |
          python3 -c '
          import os
          derived = os.path.expanduser("~/Library/Developer/Xcode/DerivedData")
          if os.path.exists(derived):
              for root, dirs, files in os.walk(derived):
                  for f in files:
                      if f.endswith(".swiftinterface"):
                          p = os.path.join(root, f)
                          try:
                              with open(p, "r", encoding="utf-8") as fl:
                                  content = fl.read()
                              if "$NonescapableTypes" in content:
                                  count = content.count("#if compiler(>=5.3) && $NonescapableTypes")
                                  content = content.replace("#if compiler(>=5.3) && $NonescapableTypes", "#if true")
                                  with open(p, "w", encoding="utf-8") as fl:
                                      fl.write(content)
                                  print(f"Patched {count} APIs in {f}")
                          except Exception as e:
                              print("Error:", e)
          '
          for fw in $(find "$HOME/Library/Developer/Xcode/DerivedData" -name "*.xcframework" 2>/dev/null || true); do
            echo "Re-signing $fw"
            codesign --force --deep --sign - "$fw" || true
          done

      - name: Build Xcode Archive
        run: |
          cd ios-swift
          xcodebuild archive \
            -project DASHit.xcodeproj \
            -scheme DASHit \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/DASHit.xcarchive \
            -skipMacroValidation \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            ENABLE_USER_SCRIPT_SANDBOXING=NO

      - name: Package Native IPA
        run: |
          cd ios-swift/build
          mkdir -p Payload
          cp -r DASHit.xcarchive/Products/Applications/DASHit.app Payload/
          zip -r -q DASHit-Native.ipa Payload
          ls -lh DASHit-Native.ipa

      - name: Upload Native iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DASHit-Native-Swift-IPA
          path: ios-swift/build/DASHit-Native.ipa
          if-no-files-found: error
