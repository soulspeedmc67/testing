name: Release the Android shop app to Google Play

# Manual only. Builds the native shop app (android-compose, com.dashit.app) as a
# signed .aab and uploads it to Google Play, so nobody has to upload it by hand.
# The version name and code come from android-compose/app/build.gradle: bump the
# versionCode before each release (Play refuses a code it has already seen).
#
# Repository secrets it needs:
#   PLAY_SERVICE_ACCOUNT_JSON   the Google Cloud service account key (JSON) that
#                               has "Release" access to the app in Play Console
#   ANDROID_UPLOAD_KEYSTORE_BASE64, ANDROID_UPLOAD_STORE_PASSWORD,
#   ANDROID_UPLOAD_KEY_ALIAS, ANDROID_UPLOAD_KEY_PASSWORD
#                               the upload key (android/dashit-release.jks);
#                               Play re-signs the app with its own key
on:
  workflow_dispatch:
    inputs:
      track:
        description: "Play track"
        type: choice
        options: [production, internal, alpha, beta]
        default: production
      status:
        description: "completed = send it out (production goes to Google's review first); draft = leave it in Play Console for you to roll out"
        type: choice
        options: [completed, draft]
        default: completed

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4

      - name: Set up the upload key
        env:
          KS_B64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          SP: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          KA: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          KP: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          if [ -z "$KS_B64" ]; then echo "::error::The ANDROID_UPLOAD_* secrets are not set"; exit 1; fi
          # Secrets set from Windows can carry a trailing CR/LF: strip it.
          printf '%s' "$KS_B64" | tr -d '\r\n ' | base64 -d > android/dashit-release.jks
          SP=$(printf '%s' "$SP" | tr -d '\r\n'); KA=$(printf '%s' "$KA" | tr -d '\r\n'); KP=$(printf '%s' "$KP" | tr -d '\r\n')
          keytool -list -keystore android/dashit-release.jks -storepass "$SP" -alias "$KA" >/dev/null || { echo "::error::The upload key or its password doesn't open"; exit 1; }
          printf 'storeFile=../dashit-release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$SP" "$KA" "$KP" > android/keystore.properties

      - name: Build the signed bundle
        working-directory: android-compose
        run: |
          # gradle.properties pins a JDK path from the owner's laptop; use the runner's JDK instead.
          ./gradlew -Dorg.gradle.java.home="$JAVA_HOME" bundleRelease
          grep -E 'versionCode|versionName' app/build.gradle | head -2

      - name: Upload to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.dashit.app
          releaseFiles: android-compose/app/build/outputs/bundle/release/app-release.aab
          mappingFile: android-compose/app/build/outputs/mapping/release/mapping.txt
          track: ${{ inputs.track }}
          status: ${{ inputs.status }}

      - name: Keep the bundle with the run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dashit-play-aab
          path: android-compose/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: ignore

      - name: Remove the key from the runner
        if: always()
        run: rm -f android/dashit-release.jks android/keystore.properties
