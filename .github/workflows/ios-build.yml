name: Build iOS IPA (GitHub Actions Cloud Mac)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS IPA (macos-14)
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Next.js Production Build
        run: npx next build

      - name: Ensure Web Assets for Capacitor
        run: |
          mkdir -p out
          cp -r .next/server/pages/* out/ 2>/dev/null || true
          cp -r public/* out/ 2>/dev/null || true

      - name: Sync Capacitor iOS Assets
        run: |
          npx cap sync ios

      - name: Build Xcode Archive
        run: |
          cd ios/App
          xcodebuild archive \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/App.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package IPA from Archive
        run: |
          cd ios/App/build
          mkdir -p Payload
          cp -r App.xcarchive/Products/Applications/App.app Payload/
          zip -r -q Dashit.ipa Payload
          ls -lh Dashit.ipa

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dashit-iOS-IPA
          path: ios/App/build/Dashit.ipa
          if-no-files-found: error
