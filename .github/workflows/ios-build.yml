name: Build iOS IPA (GitHub Actions Cloud Mac)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS Native Project (macos-latest)
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Next.js Production Build
        run: npx next build

      - name: Ensure Web Assets for Capacitor
        run: |
          mkdir -p out
          cp -r .next/server/pages/* out/ 2>/dev/null || true
          cp -r public/* out/ 2>/dev/null || true

      - name: Add and Sync Capacitor iOS Assets
        run: |
          npx cap add ios || true
          npx cap sync ios

      - name: Build Xcode iOS Project (Archive)
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -derivedDataPath build -archivePath build/App.xcarchive archive CODE_SIGNING_ALLOWED=NO

      - name: Upload iOS Archive / App Bundle Artifact
        uses: actions/upload-artifact@v3
        with:
          name: DASHit-Anantnag-iOS-Bundle
          path: ios/App/build/App.xcarchive
