name: Build iOS IPA (GitHub Actions Cloud Mac)

on:
  push:
    branches: [ main, native-android-compose, native-swift-ios ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS IPA (Xcode 16 + macos-14)
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode 16
        run: |
          echo "Available Xcode installations:"
          ls -d /Applications/Xcode* || true
          for xcode in /Applications/Xcode_16*.app /Applications/Xcode_16.app; do
            if [ -d "$xcode" ]; then
              echo "Selecting $xcode"
              sudo xcode-select -s "$xcode/Contents/Developer"
              break
            fi
          done
          xcodebuild -version

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Next.js Production Build
        run: npx next build
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY || 'AIzaSyB6tH6rYJ3fDZ7SBVkTNL3i_lOTXkPYjsg' }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN || 'dashit-1ecba.firebaseapp.com' }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID || 'dashit-1ecba' }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET || 'dashit-1ecba.firebasestorage.app' }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID || '391742831837' }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID || '1:391742831837:web:a66d0d0920d75b24f4ef34' }}
          NEXT_PUBLIC_AUTH_MODE: otp
          NEXT_PUBLIC_OTP_FIXED: "0"
          NEXT_PUBLIC_TRUECALLER_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_TRUECALLER_CLIENT_ID || 'yxekbcxiwocqnjm3ocnd2uk5kgqrzfooz1k635ezzrs' }}

      - name: Ensure Web Assets for Capacitor
        run: |
          mkdir -p out
          cp -r .next/server/pages/* out/ 2>/dev/null || true
          cp -r public/* out/ 2>/dev/null || true

      - name: Sync Capacitor iOS Assets
        run: |
          npx cap sync ios

      - name: Resolve Swift Packages & Un-gate Capacitor APIs
        run: |
          cd ios/App
          xcodebuild -resolvePackageDependencies -project App.xcodeproj
          python3 -c '
          import os
          derived = os.path.expanduser("~/Library/Developer/Xcode/DerivedData")
          for root, dirs, files in os.walk(derived):
              for f in files:
                  if f.endswith(".swiftinterface"):
                      p = os.path.join(root, f)
                      try:
                          with open(p, "r", encoding="utf-8") as fl:
                              content = fl.read()
                          if "$NonescapableTypes" in content:
                              count = content.count("#if compiler(>=5.3) && $NonescapableTypes")
                              content = content.replace("#if compiler(>=5.3) && $NonescapableTypes", "#if true")
                              with open(p, "w", encoding="utf-8") as fl:
                                  fl.write(content)
                              print(f"Patched {count} APIs in {f}")
                      except Exception as e:
                          print("Error:", e)
          '
          # Re-sign modified xcframeworks with ad-hoc signature so Xcode signature verification passes
          for fw in $(find "$HOME/Library/Developer/Xcode/DerivedData" -name "*.xcframework"); do
            echo "Re-signing $fw"
            codesign --force --deep --sign - "$fw" || true
          done

      - name: Install Apple Certificate and Provisioning Profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERT_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_CERT_PASSWORD || 'dashit2026' }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: "dashit_keychain_pass"
        run: |
          if [ -z "$BUILD_CERTIFICATE_BASE64" ]; then
            echo "No signing certificate secret found — skipping certificate installation."
            exit 0
          fi
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o $PP_PATH

          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH $(security list-keychain -d user | tr -d ' "')

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          UUID=$(grep -aA1 UUID "$PP_PATH" | grep -o "[-A-Za-z0-9]\{36\}" | head -n1 || echo "7070b2b6-e577-47ac-a565-caa38b4ca0ab")
          echo "Installing provisioning profile with UUID: $UUID"
          cp "$PP_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/$UUID.mobileprovision
          cp "$PP_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/DASHit_AppStore_Profile.mobileprovision

      - name: Build and Export Xcode IPA
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERT_BASE64 }}
        run: |
          cd ios/App
          if [ -n "$BUILD_CERTIFICATE_BASE64" ]; then
            echo "Building signed App Store release..."
            xcodebuild archive \
              -project App.xcodeproj \
              -scheme App \
              -configuration Release \
              -destination "generic/platform=iOS" \
              -archivePath build/App.xcarchive \
              -skipMacroValidation \
              -skipPackagePluginValidation \
              CURRENT_PROJECT_VERSION=$GITHUB_RUN_NUMBER \
              CODE_SIGN_STYLE=Manual \
              CODE_SIGN_IDENTITY="Apple Distribution" \
              PROVISIONING_PROFILE_SPECIFIER="DASHit AppStore Profile" \
              DEVELOPMENT_TEAM="8V873ZU49N"

            xcodebuild -exportArchive \
              -archivePath build/App.xcarchive \
              -exportOptionsPlist ExportOptions.plist \
              -exportPath build/export

            cp build/export/*.ipa build/Dashit.ipa
          else
            echo "No signing secrets found — building unsigned release..."
            xcodebuild archive \
              -project App.xcodeproj \
              -scheme App \
              -configuration Release \
              -destination "generic/platform=iOS" \
              -archivePath build/App.xcarchive \
              -skipMacroValidation \
              -skipPackagePluginValidation \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY=""

            cd build
            mkdir -p Payload
            cp -r App.xcarchive/Products/Applications/App.app Payload/
            zip -r -q Dashit.ipa Payload
          fi

      - name: Upload to TestFlight (Internal Testing)
        if: env.APP_STORE_CONNECT_KEY_P8 != '' && env.APP_STORE_CONNECT_ISSUER_ID != ''
        env:
          APP_STORE_CONNECT_KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID || '2P8Y532J2R' }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          echo "Setting up App Store Connect API Key..."
          mkdir -p ~/.appstoreconnect/private_keys
          KEY_FILE=~/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8
          if echo "$APP_STORE_CONNECT_KEY_P8" | grep -q "BEGIN PRIVATE KEY"; then
            echo "$APP_STORE_CONNECT_KEY_P8" > "$KEY_FILE"
          else
            echo "$APP_STORE_CONNECT_KEY_P8" | base64 --decode > "$KEY_FILE"
          fi
          chmod 600 "$KEY_FILE"

          echo "Uploading Dashit.ipa to TestFlight via App Store Connect API..."
          xcrun altool --upload-app \
            --type ios \
            --file ios/App/build/Dashit.ipa \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID" \
            --show-progress

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dashit-Admin-IPA
          path: ios/App/build/Dashit.ipa
          if-no-files-found: error
