name: Build Android APK (Gradle + Java 17)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK File
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17 (JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Next.js Production Build
        run: npx next build

      - name: Ensure Capacitor Web Assets Directory
        run: |
          mkdir -p out
          cp -r .next/server/pages/* out/ 2>/dev/null || true
          cp -r public/* out/ 2>/dev/null || true

      - name: Sync Capacitor Android Assets
        run: |
          npx cap add android || true
          npx cap sync android || true

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DASHit-Anantnag-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
