name: Build Android APK (Gradle + Java 17)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK File
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Java 17 (JDK)
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Next.js Static Export
        run: npx next build

      - name: Sync Capacitor Android Assets
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Binary Artifact
        uses: actions/upload-artifact@v3
        with:
          name: DASHit-Anantnag-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
