name: Build Android driver / admin APK

# Manual only. Builds the Capacitor Android apps (flavors: driver, admin) and attaches the APK
# to the run as an artifact. Nothing is released or uploaded anywhere.
#
# Signing: release build. If the repository secrets ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
# ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD are set, the release APK is signed with that key
# (installs over the existing release app). Otherwise a NEW key is generated and shipped in the
# artifact's newkey/ folder: keep it and add it as those secrets so later builds use the same key.
on:
  workflow_dispatch:
    inputs:
      flavor:
        description: "App to build"
        type: choice
        options: [driver, admin, both]
        default: driver

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - name: Build the web bundle
        run: npm run build
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY || 'AIzaSyB6tH6rYJ3fDZ7SBVkTNL3i_lOTXkPYjsg' }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN || 'dashit-1ecba.firebaseapp.com' }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID || 'dashit-1ecba' }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET || 'dashit-1ecba.firebasestorage.app' }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID || '391742831837' }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID || '1:391742831837:web:a66d0d0920d75b24f4ef34' }}
          NEXT_PUBLIC_AUTH_MODE: otp
          NEXT_PUBLIC_OTP_FIXED: "0"
      - run: npx cap sync android
      - name: Set up release signing (secrets if set, otherwise a brand-new key)
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > android/release.jks
            SP='${{ secrets.ANDROID_KEYSTORE_PASSWORD }}'; KA='${{ secrets.ANDROID_KEY_ALIAS }}'; KP='${{ secrets.ANDROID_KEY_PASSWORD }}'
          else
            SP=$(openssl rand -hex 16); KA=dashit; KP=$SP
            keytool -genkeypair -keystore android/release.jks -storetype PKCS12 -alias "$KA" \
              -keyalg RSA -keysize 2048 -validity 10000 -storepass "$SP" -keypass "$KP" \
              -dname "CN=DASHit, O=DASHit, L=Anantnag, C=IN"
            mkdir -p newkey && cp android/release.jks newkey/dashit-release.jks
            printf 'storePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$SP" "$KA" "$KP" > newkey/key-info.txt
          fi
          printf 'storeFile=../release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$SP" "$KA" "$KP" > android/keystore.properties
      - name: Build
        working-directory: android
        run: |
          # gradle.properties pins a JDK path from the owner's laptop; use the runner's JDK instead.
          G="./gradlew -Dorg.gradle.java.home=$JAVA_HOME"
          case "${{ inputs.flavor }}" in
            both) $G assembleDriverRelease assembleAdminRelease ;;
            admin) $G assembleAdminRelease ;;
            *) $G assembleDriverRelease ;;
          esac
      - uses: actions/upload-artifact@v4
        with:
          name: dashit-android-apk
          path: |
            android/app/build/outputs/apk/**/*.apk
            newkey/
