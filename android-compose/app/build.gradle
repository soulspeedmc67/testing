plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'com.google.gms.google-services'
}

android {
    namespace 'com.dashit.app'
    compileSdk 36

    defaultConfig {
        applicationId "com.dashit.app"
        minSdk 26
        targetSdk 36
        // Well above the old web-wrapper app (android/, same app ID, up to 6), so
        // this native app always installs over it and never the other way round.
        versionCode 101
        versionName "1.2.1"

        // The sign-in server next to the website (public/api/auth/). A test build
        // can use another: ./gradlew installDebug -PsignInServer=http://127.0.0.1:8099/api/auth/
        buildConfigField "String", "SIGN_IN_SERVER", "\"${project.findProperty('signInServer') ?: 'https://dashit.co.in/api/auth/'}\""

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            applicationIdSuffix ""
            debuggable true
        }
        // Local speed tests only: optimised like release, signed with the
        // debug key, never uploaded. Debug builds run Compose several times
        // slower than what shoppers get, so they can't judge smoothness.
        profile {
            initWith release
            signingConfig signingConfigs.debug
            matchingFallbacks = ['release']
        }
    }
    sourceSets {
        profile { kotlin.srcDirs += 'src/release/kotlin' }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    kotlinOptions {
        jvmTarget = '21'
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

dependencies {
    def composeBom = platform('androidx.compose:compose-bom:2024.10.01')
    implementation composeBom
    androidTestImplementation composeBom

    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.compose.foundation:foundation'

    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.7'
    implementation 'androidx.core:core-splashscreen:1.0.1'

    // Async Image loading with caching
    implementation 'io.coil-kt:coil-compose:2.7.0'
    // Online payments: Razorpay's checkout, which offers every method Razorpay
    // supports in India (UPI, cards, netbanking, wallets, EMI, Pay Later).
    implementation 'com.razorpay:checkout:1.6.41'
    // UPI apps opened directly from our checkout (Custom UI kit, UPI intent).
    implementation 'com.razorpay:customui:3.9.22'
    constraints {
        // customui asks for "latest" of these; pinned so a build never changes under us.
        implementation('com.razorpay:customui-core') { version { strictly '3.10.16' } }
        implementation('com.razorpay:standard-core') { version { strictly '1.7.19' } }
    }

    // Firebase Firestore & Auth
    def firebaseBom = platform('com.google.firebase:firebase-bom:33.7.0')
    implementation firebaseBom
    implementation 'com.google.firebase:firebase-auth-ktx'
    implementation 'com.google.firebase:firebase-firestore-ktx'
    implementation 'com.google.firebase:firebase-messaging'
    // Sign in with Google (Credential Manager's "Sign in with Google" sheet).
    implementation 'androidx.credentials:credentials:1.3.0'
    implementation 'androidx.credentials:credentials-play-services-auth:1.3.0'
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.1.1'
    // App Check: Firestore and sign-in only answer the real app (see DashitApp.kt).
    implementation 'com.google.firebase:firebase-appcheck-playintegrity'
    debugImplementation 'com.google.firebase:firebase-appcheck-debug'

    // Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.9.0'

    // OpenStreetMap (osmdroid)
    implementation 'org.osmdroid:osmdroid-android:6.1.20'

    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
}
