name: DASHit
options:
  bundleIdPrefix: com.dashit
  deploymentTarget:
    iOS: "17.0"

packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk.git
    from: 10.28.0

targets:
  DASHit:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: DASHit
      # Shared with the widget extension so the app and the Live Activity
      # encode the same ContentState and draw the same progress rail.
      - path: DASHitWidgets/DASHitOrderAttributes.swift
      - path: DASHitWidgets/OrderProgressRail.swift
    dependencies:
      - target: DASHitWidgets
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - sdk: SwiftUI.framework
      - sdk: MapKit.framework
      - sdk: PassKit.framework
      - sdk: ActivityKit.framework
      - sdk: WidgetKit.framework
      - sdk: AVFoundation.framework
      - sdk: CoreLocation.framework
      - sdk: CoreHaptics.framework
      - sdk: AuthenticationServices.framework
      - sdk: Speech.framework
    info:
      path: DASHit/Info.plist
      properties:
        CFBundleDisplayName: DASHit
        CFBundleIdentifier: com.dashit.app
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        # Plain midnight while the app starts; SplashView then reveals the logo.
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIRequiredDeviceCapabilities: [arm64]
        # App Store Connect rejects iPad-capable builds without all four iPad orientations.
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Lets SwiftUI animations run at 120Hz on ProMotion iPhones; without it
        # Core Animation caps custom animations at 60Hz.
        CADisableMinimumFrameDurationOnPhone: true
        # Only standard HTTPS (Firebase); exempt from export documentation.
        ITSAppUsesNonExemptEncryption: false
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: true
        NSLocationWhenInUseUsageDescription: "DASHit requires your delivery address location to deliver groceries in Anantnag and show live courier arrival on the map."
        NSMicrophoneUsageDescription: "DASHit uses the microphone only while you search for products by voice."
        NSSpeechRecognitionUsageDescription: "DASHit turns what you say into search text so you can find products by voice."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dashit.app
        # Home screen icon from DASHit/Assets.xcassets/AppIcon.appiconset.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        SWIFT_VERSION: "5.9"
        INFOPLIST_FILE: DASHit/Info.plist
        # Sign in with Apple. Takes effect once the app is signed with a paid
        # Apple Developer team that has the capability enabled.
        CODE_SIGN_ENTITLEMENTS: DASHit/DASHit.entitlements

  # Lock Screen + Dynamic Island Live Activity. ActivityKit only renders an
  # activity when an embedded widget extension declares its ActivityConfiguration.
  DASHitWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: DASHitWidgets
    dependencies:
      - sdk: SwiftUI.framework
      - sdk: WidgetKit.framework
      - sdk: ActivityKit.framework
    info:
      path: DASHitWidgets/Info.plist
      properties:
        CFBundleDisplayName: DASHit
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dashit.app.widgets
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        SWIFT_VERSION: "5.9"
        INFOPLIST_FILE: DASHitWidgets/Info.plist
        SKIP_INSTALL: YES

  # The admin console as its own app. It compiles the same sources with
  # ADMIN_APP_TARGET set, which swaps in DASHitAdminApp as the entry point.
  # It keeps a separate Info.plist: sharing DASHit/Info.plist let whichever
  # target XcodeGen wrote last overwrite the customer app's name, launch
  # screen and permission strings.
  DASHitAdmin:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: DASHit
      - path: DASHitWidgets/DASHitOrderAttributes.swift
      - path: DASHitWidgets/OrderProgressRail.swift
    dependencies:
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - sdk: SwiftUI.framework
      - sdk: MapKit.framework
      - sdk: PassKit.framework
      - sdk: ActivityKit.framework
      - sdk: WidgetKit.framework
      - sdk: AVFoundation.framework
      - sdk: CoreLocation.framework
      - sdk: CoreHaptics.framework
      - sdk: AuthenticationServices.framework
      - sdk: Speech.framework
    info:
      path: DASHitAdmin/Info.plist
      properties:
        CFBundleDisplayName: "DASHit Admin"
        CFBundleIdentifier: com.dashit.app
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIRequiredDeviceCapabilities: [arm64]
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CADisableMinimumFrameDurationOnPhone: true
        ITSAppUsesNonExemptEncryption: false
        NSLocationWhenInUseUsageDescription: "DASHit Admin uses your location to show the delivery area and riders on the map."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dashit.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        OTHER_SWIFT_FLAGS: $(inherited) -DADMIN_APP_TARGET
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        SWIFT_VERSION: "5.9"
        INFOPLIST_FILE: DASHitAdmin/Info.plist
        CODE_SIGN_ENTITLEMENTS: DASHit/DASHit.entitlements
